# >>> RGBERRY-AUDIO-PI4  (added by rgberry-audio-select, do not edit)
# Raspberry Pi 2..4: PWM audio on GPIO18/19 comes from the SoC itself
# (dtoverlay=audremap,pins_18_19 + dtparam=audio=on -> card "Headphones").
# Make it the default device and the default mixer ("PCM"), so the same SD
# card behaves like on a Pi 5.  Only used if this file is installed as
# /etc/rgberry-audio/asound-pi4.conf.
pcm.!default {
    type plug
    slave.pcm "hw:Headphones"
}
ctl.!default {
    type hw
    card "Headphones"
}
# <<< RGBERRY-AUDIO-PI4

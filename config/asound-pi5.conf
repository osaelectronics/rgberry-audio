# >>> RGBERRY-AUDIO-PI5  (added by rgberry-audio-select, do not edit)
# Raspberry Pi 5: default output -> volume -> mixer -> loopback -> rgberry-audio
# daemon -> PWM on GPIO18/19.  Everything above this block is the original
# /etc/asound.conf; on Pi 2..4 that original is restored at boot.

pcm.rgberry_dmix {
    type dmix
    ipc_key 52018
    ipc_perm 0666
    slave {
        pcm "hw:sndrpihifiberry,0,0"
        rate 48000
        format S16_LE
        channels 2
        period_size 256
        buffer_size 2048
    }
}

pcm.rgberry_vol {
    type softvol
    slave.pcm "rgberry_dmix"
    control {
        name "Master"
        card sndrpihifiberry
    }
    min_dB -51.0
    max_dB 0.0
}

pcm.rgberry {
    type plug
    slave.pcm "rgberry_vol"
    hint.description "RGBerry SCART audio"
}

pcm.hifiberry {
    type plug
    slave.pcm "rgberry"
}

pcm.!default rgberry

# RePlay OS: its "Primary HDMI" output opens this PCM.  With a SCART HAT the
# HDMI audio is useless, so on a Pi 5 send it to the SCART instead.
# "Secondary HDMI" is left untouched.
pcm.!replay_hdmi0_pi45 {
    type plug
    slave.pcm "rgberry"
}

ctl.!default {
    type hw
    card sndrpihifiberry
}
# <<< RGBERRY-AUDIO-PI5

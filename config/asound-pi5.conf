# >>> RGBERRY-AUDIO-PI5  (added by rgberry-audio-select, do not edit)
# Raspberry Pi 5: audio goes through the "rgberry" ALSA plugin straight into
# the rgberry-audio daemon (RP1 PIO -> PWM on GPIO18/19).  One clock only,
# no loopback.  Everything above this block is the original /etc/asound.conf;
# on Pi 2..4 that original is restored at boot.

# the device itself: S16_LE, 2 channels, 48 kHz
pcm.rgberry_hw {
    type rgberry
}

# any format / rate / channel count
pcm.rgberry {
    type plug
    slave {
        pcm "rgberry_hw"
        format S16_LE
        rate 48000
        channels 2
    }
    hint.description "RGBerry SCART audio"
}

pcm.hifiberry {
    type plug
    slave.pcm "rgberry"
}

pcm.!default {
    type plug
    slave.pcm "rgberry"
}

# mixer: "PCM" volume + switch (alsamixer, amixer, EmulationStation...)
ctl.rgberry {
    type rgberry
}

ctl.!default {
    type rgberry
}

# RePlay OS: its "Primary HDMI" output opens this PCM.  With a SCART HAT the
# HDMI audio is useless, so on a Pi 5 send it to the SCART instead (SDL does
# its own high-quality conversion to 48 kHz).  "Secondary HDMI" is untouched.
pcm.!replay_hdmi0_pi45 {
    type rgberry
}
ctl.!replay_hdmi0_pi45 {
    type rgberry
}
# <<< RGBERRY-AUDIO-PI5
